[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "macfit"
version = "0.1.0"
description = "Will this model fit on my Mac? Estimates the peak memory of mlx-lm before you download the weights."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]

[project.scripts]
macfit = "macfit:main"

[tool.setuptools]
py-modules = ["macfit"]
